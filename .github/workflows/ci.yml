name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: policy-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run agentic policy checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/agent/*.sh scripts/agent/*.py || true
          scripts/agent/check_change_control.sh

  generic-checks:
    name: generic-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run framework checks
        run: |
          bash scripts/agent/run_framework_checks.sh
